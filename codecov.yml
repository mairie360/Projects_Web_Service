# Seuil de couverture du projet : 60 %, le même que celui de npm test
# (--test-coverage-lines=60 dans package.json). Sans ce fichier, Codecov
# applique sa cible par défaut `auto` : il exige alors de ne jamais descendre
# sous la couverture de `main`, ce qui fait échouer une PR à 82 % dès que
# `main` est au-dessus (les imports/types/commentaires erasés par le
# transpileur TS comptent comme non couverts, cf. CLAUDE.md).
coverage:
  status:
    project:
      default:
        target: 60%
        # Pas de tolérance supplémentaire : 60 % est déjà le plancher.
        threshold: 0%
        if_ci_failed: error
    patch:
      default:
        target: 60%
        threshold: 0%

# La couverture n'est mesurée que sur src/ (cf. --test-coverage-include='src/**').
ignore:
  - "tests/**"
  - "scripts/**"
  - "contracts/**"

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
