# Stack de test de performance ISOLÉE pour le front Projects (Projects_Web_Service).
#
#   ./performance_test.sh          (local, NODE_AUTH_TOKEN exporté pour le build)
#   docker compose -f docker-compose-performance.yml up --build \
#       --abort-on-container-exit --exit-code-from k6-perf-test   (CI)
#
# k6-perf-test sort en échec si un seuil de load-test.js est dépassé.
# TARGET_IMAGE (optionnel) : image front pré-construite à tester au lieu du build local.

secrets:
  node_auth_token:
    environment: NODE_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

# MAIR-680: Core alone signs the session JWTs (EdDSA) with the run's Ed25519 key pair of
# stack_secrets.sh; every other service only gets the public key. No JWT_SECRET, so no HS256 token
# is accepted. The front relays its accessToken cookie as is (Bearer) down the chain.
x-api-env: &api-env
  <<: *db-env
  HOST: "0.0.0.0"
  REDIS_URL: redis://redis:6379
  JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
  JWT_TIMEOUT: 3600

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true;
    # without it the migration fails on a fresh database. Test / dev stacks only.
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: projects-front-perf-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: projects-front-perf-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3000
      PUBLIC_URL: http://core-api:3000
      # Core refuses to start without its Resend configuration (MAIR-522). No page of this front sends an
      # e-mail through these stacks, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      # MAIR-680: Core alone signs the session JWTs (EdDSA) with the run's Ed25519 key pair.
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      # The API rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
    expose:
      - "3000"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur core-api-ready ci-dessous.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: projects-front-perf-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  project-api:
    image: ${PROJECT_API_IMAGE:-ghcr.io/mairie360/project-api:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-project-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
      PORT: 3001
      PUBLIC_URL: http://project-api:3001
      # The API rate-limits each account (MAIR-425): the scan / load test hammer it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Project API >= MAIR-688 (lib rate_limit_middleware) ignores RATE_LIMIT_ENABLED and limits each
      # account to RATE_LIMIT_PER_SECOND (default 20, burst 50): 0 turns it off, like its own stacks.
      RATE_LIMIT_PER_SECOND: "0"
    expose:
      - "3001"
    networks:
      - backend
    # L'image publiée est "distroless" (ni shell ni curl) : la disponibilité est
    # sondée depuis le conteneur project-api-ready ci-dessous.

  project-api-ready:
    image: curlimages/curl:latest
    container_name: projects-front-perf-project-api-ready
    depends_on:
      project-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://project-api:3001/health >/dev/null; do
      echo "waiting for project-api..."; sleep 2; done; echo "project-api ready"'
    networks:
      - backend

  bff-user:
    image: ${BFF_USER_IMAGE:-ghcr.io/mairie360/bff-user:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-bff-user
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4000
      REDIS_URL: redis://redis:6379
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
      CORE_API_URL: http://core-api:3000
      # The scanners replay the auth routes from one IP with invalid credentials on purpose: the
      # auth rate limits of BFF User (MAIR-226) would answer 429 and hide the real responses.
      AUTH_RATE_LIMIT_ENABLED: "false"
    expose:
      - "4000"
    networks:
      - backend

  bff-user-ready:
    image: curlimages/curl:latest
    container_name: projects-front-perf-bff-user-ready
    depends_on:
      bff-user:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-user:4000/health >/dev/null; do
      echo "waiting for bff-user..."; sleep 2; done; echo "bff-user ready"'
    networks:
      - backend

  bff-project:
    image: ${BFF_PROJECT_IMAGE:-ghcr.io/mairie360/bff-project:${UPSTREAM_TAG:-dev}}
    pull_policy: ${UPSTREAM_PULL_POLICY:-always}
    container_name: projects-front-perf-bff-project
    depends_on:
      seeder:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
      project-api-ready:
        condition: service_completed_successfully
      bff-user-ready:
        condition: service_completed_successfully
    environment:
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 4001
      REDIS_URL: redis://redis:6379
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      PROJECT_API_URL: project-api
      PROJECT_API_PORT: 3001
      PROJECT_API_BASE_PATH: http://project-api:3001
      USER_BFF_URL: http://bff-user:4000
      # MAIR-680: Core's public key only, no JWT_SECRET: every HS256 token is refused.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4001"
    networks:
      - backend

  bff-project-ready:
    image: curlimages/curl:latest
    container_name: projects-front-perf-bff-project-ready
    depends_on:
      bff-project:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://bff-project:4001/health >/dev/null; do
      echo "waiting for bff-project..."; sleep 2; done; echo "bff-project ready"'
    networks:
      - backend

  projects-front:
    image: ${TARGET_IMAGE:-projects-front:perf}
    container_name: projects-front-perf-front
    # Image de production (Next.js standalone), identique à celle publiée par la CI.
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - node_auth_token
    depends_on:
      bff-project-ready:
        condition: service_completed_successfully
    environment:
      HOSTNAME: "0.0.0.0"
      PORT: 5001
      # Readiness resumes on this isolated frontend origin without following Login.
      LOGIN_FRONT_URL: "${LOGIN_FRONT_URL:-http://login-front.invalid/}"
      PROJECT_FRONT_URL: http://projects-front:5001/
      BFF_PROJECT_BASE_URL: http://bff-project:4001
    expose:
      - "5001"
    networks:
      - backend
    # curl est installé dans l'image runner. Sans cookie, le middleware répond 307
    # (reprise locale) : curl -f l'accepte, seul un statut >= 400 échoue.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:5001/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  k6-perf-test:
    image: grafana/k6:latest
    container_name: projects-front-perf-k6
    depends_on:
      projects-front:
        condition: service_healthy
    volumes:
      - ./load-test.js:/load-test.js:ro
    environment:
      BASE_URL: http://projects-front:5001
      # k6 cannot sign Ed25519: the token is signed by stack_secrets.sh (sub=2, like Core signs it).
      ACCESS_TOKEN: ${ACCESS_TOKEN:?ACCESS_TOKEN is signed by stack_secrets.sh, run ./performance_test.sh}
    command: ["run", "/load-test.js"]
    networks:
      - backend
